
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK ACE - Guild Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. FLEXBOX NAVIGATION BAR -->
<header class="navbar">
<div class="nav-brand">
<span class="logo-symbol">⚔️</span>
<h1 class="logo-text">DARK ACE</h1>
</div>

<div class="nav-actions">
<button class="btn btn-secondary">Settings</

button>
<button class="btn btn-primary">Guild Profile</button>
</div>
</header>

<!-- MAIN CONTAINER -->
<main class="dashboard-container">

<!-- WELCOME HEADER -->
<section class="welcome-banner">
<h2>Welcome Back, <span class="highlight">Victor</span> 👋</h2>
<p>Here is your guild performance overview for this week.</p>
</section>

<!-- 2. CSS GRID DASHBOARD CARDS -->
<section class="stats-grid">

<div class="stat-card">
<div class="card-header">
<h3>Total Members</h3>
<span class="card-icon">👥</span>
</div>
<p class="stat-number">48 <span class="stat-max">/ 50</span></p>
<span class="stat-badge badge-green">+3 this week</span>
</div>

<div class="stat-card">
<div class="card-header">
<h3>Guild Rank</h3>
<span class="card-icon">🏆</span>
</div>
<p class="stat-number">#3</p>
<span class="stat-badge badge-gold">Top Tier</span>
</div>


<div class="stat-card">
<div class="card-header">
<h3>Matches Won</h3>
<span class="card-icon">🔥</span>
</div>
<p class="stat-number">142</p>
<span class="stat-badge badge-green">88% Win Rate</span>
</div>

<div class="stat-card">
<div class="card-header">
<h3>Guild Points</h3>
<span class="card-icon">⚡</span>
</div>
<p class="stat-number">24,500</p>
<span class="stat-badge badge-crimson">Season 4</span>
</div>


</section>

</main>

</body>
</html>
